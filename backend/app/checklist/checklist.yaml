controls:
  - code: CTRL-001
    title: HTTP Strict Transport Security
    type: AUTOMATED
    severity: HIGH
    description: HSTS header check. Must contain max-age of at least 1 year (31536000s).
    recommendation: Add Strict-Transport-Security header with max-age=31536000.

  - code: CTRL-002
    title: Secure Cookie Flags
    type: AUTOMATED
    severity: MEDIUM
    description: All session cookies must have HttpOnly and Secure flags, and SameSite set to Strict/Lax.
    recommendation: Set HttpOnly, Secure, and SameSite=Lax flags on session cookies.

  - code: CTRL-003
    title: Content Security Policy
    type: AUTOMATED
    severity: HIGH
    description: CSP header check. Must exist and not allow wildcard default-src *.
    recommendation: Implement a Content-Security-Policy header restricting sources.

  - code: CTRL-004
    title: X-Content-Type-Options
    type: AUTOMATED
    severity: LOW
    description: Header must be set to nosniff.
    recommendation: "Add X-Content-Type-Options: nosniff header."

  - code: CTRL-005
    title: Cache-Control Policies
    type: AUTOMATED
    severity: LOW
    description: "Sensitive pages must set Cache-Control: no-store, no-cache."
    recommendation: "Add Cache-Control: no-store, no-cache, must-revalidate header on sensitive endpoints."

  - code: CTRL-006
    title: Secure Password Forms
    type: AUTOMATED
    severity: HIGH
    description: Login forms must submit passwords via HTTPS POST, not HTTP or GET.
    recommendation: Ensure all form submissions containing credentials use HTTPS POST.

  - code: CTRL-007
    title: Cookie Path Restriction
    type: AUTOMATED
    severity: LOW
    description: Cookies must specify a restricted path rather than defaulting to / where applicable.
    recommendation: Explicitly set path parameter when setting cookies.

  - code: CTRL-008
    title: Server Banner Disclosure
    type: AUTOMATED
    severity: LOW
    description: Headers must not leak server versions (e.g., Server or X-Powered-By).
    recommendation: Disable server tokens in Nginx/Apache configuration and remove custom powered-by headers.

  - code: CTRL-009
    title: Active Scan Vulnerabilities
    type: SCANNER
    severity: HIGH
    description: Target must not have High or Critical alerts in active scanning.
    recommendation: Remediate high and critical vulnerabilities identified by vulnerability scanners.

  - code: CTRL-010
    title: Unencrypted HTTP Fallback
    type: AUTOMATED
    severity: HIGH
    description: Validates that HTTP requests are automatically redirected to HTTPS.
    recommendation: Configure a global redirect from port 80 to port 443 in the web server.


