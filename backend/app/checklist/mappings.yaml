rules:
  - control_code: CTRL-001
    source: HTTP_CHECK
    condition: regex_match
    pattern: "(?i)strict-transport-security:\\s*max-age=(\\d+)"
    min_value: 31536000
    fail_msg: HSTS header is missing or max-age is less than 31536000 seconds (1 year).

  - control_code: CTRL-002
    source: HTTP_CHECK
    condition: regex_match
    pattern: "(?i)set-cookie:.*httponly.*secure"
    fail_msg: Session cookies lack HttpOnly or Secure flags.

  - control_code: CTRL-003
    source: HTTP_CHECK
    condition: not_contains
    pattern: "default-src *"
    fail_msg: Content Security Policy allows wildcard sources.

  - control_code: CTRL-004
    source: HTTP_CHECK
    condition: regex_match
    pattern: "(?i)x-content-type-options:\\s*nosniff"
    fail_msg: X-Content-Type-Options is missing or not set to nosniff.

  - control_code: CTRL-005
    source: HTTP_CHECK
    condition: contains
    pattern: "no-store"
    fail_msg: Cache-Control header is missing no-store or no-cache directive.

  - control_code: CTRL-006
    source: HTTP_CHECK
    condition: not_contains
    pattern: "method=\"GET\" action=\"/login\""
    fail_msg: Password form submits via GET instead of POST.

  - control_code: CTRL-007
    source: HTTP_CHECK
    condition: contains
    pattern: "path="
    fail_msg: Cookies do not restrict path.

  - control_code: CTRL-008
    source: HTTP_CHECK
    condition: not_contains
    pattern: "Server: Apache/2.4"
    fail_msg: Web server version banner is disclosed.

  - control_code: CTRL-009
    source: ZAP
    condition: not_contains
    pattern: "High Vulnerability"
    fail_msg: Active scanner detected High/Critical vulnerabilities.

  - control_code: CTRL-010
    source: HTTP_CHECK
    condition: contains
    pattern: "Redirect to HTTPS"
    fail_msg: Unencrypted HTTP request did not redirect to HTTPS.
